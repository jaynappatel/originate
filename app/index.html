<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Originate</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="onboarding" class="onboarding-overlay">
    <div class="onboarding-card">
      <div class="onboarding-head">
        <div class="pet-track large" id="onboarding-pet"></div>
        <div>
          <div class="onboarding-title">Set up your instance</div>
          <div class="onboarding-sub">Describe what you're sourcing and diligencing. This becomes your config, and your config becomes your skills.</div>
        </div>
      </div>

      <label>Closest starting point
        <select id="ob-vertical">
          <option value="vc">Venture capital sourcing</option>
          <option value="recruiting">Executive search / recruiting</option>
          <option value="real-estate">Real estate acquisition</option>
          <option value="custom">Something else (start blank)</option>
        </select>
      </label>

      <label>What are you sourcing, and what does a good one look like?
        <textarea id="ob-purpose" rows="4" placeholder="e.g. Bootstrapped vertical SaaS companies, $3-10M ARR, SMB/mid-market customers, founder-led."></textarea>
      </label>

      <div class="onboarding-status" id="onboarding-status"></div>
      <div class="onboarding-log" id="onboarding-log"></div>
      <div class="onboarding-done-banner" id="onboarding-done" hidden></div>

      <div class="onboarding-actions">
        <button class="primary-btn" id="ob-generate-btn">Generate my skills</button>
        <button class="ghost-btn" id="ob-enter-btn" hidden>Open console</button>
      </div>
    </div>
  </div>

  <div class="full-shell" id="main-shell" hidden>
    <aside class="full-sidebar">
      <div class="sidebar-brand">
        <span class="sidebar-brand-dot"></span>
        <span class="sidebar-brand-name">Originate</span>
      </div>

      <nav>
        <div class="nav-group-label">Configure</div>
        <button class="nav-item active" data-tab="config">Config</button>
        <button class="nav-item" data-tab="generate">Generate skill</button>
      </nav>

      <nav>
        <div class="nav-group-label">Instance</div>
        <button class="nav-item" id="nav-restart-onboarding">Redo setup</button>
      </nav>
    </aside>

    <div style="flex:1; display:flex; flex-direction:column; min-width:0;">
      <header class="full-topbar">
        <div class="topbar-title" id="topbar-title">Config</div>
        <div class="topbar-right">
          <span class="status-pill" id="status-pill"><span class="dot"></span><span id="status-pill-text">Ready</span></span>
          <div class="pet-track" id="topbar-pet"></div>
        </div>
      </header>

      <main class="full-main">
        <nav class="vertical-switcher" id="vertical-switcher" style="margin-bottom:16px;">
          <button data-vertical="vc" class="active">VC</button>
          <button data-vertical="recruiting">Recruiting</button>
          <button data-vertical="real-estate">Real Estate</button>
          <button data-vertical="custom">Custom (blank)</button>
        </nav>

        <div class="console-body">
          <div class="sidebar-panels">
            <section class="panel">
              <h2>Org &amp; vocabulary</h2>
              <label>Organization name
                <input id="f-org-name" type="text" />
              </label>
              <label>Approver title
                <input id="f-approver-title" type="text" />
              </label>
              <div class="field-row">
                <label>Entity (singular)
                  <input id="f-entity" type="text" />
                </label>
                <label>Entity (plural)
                  <input id="f-entity-plural" type="text" />
                </label>
              </div>
              <label>Verdicts (comma-separated)
                <input id="f-verdicts" type="text" />
              </label>
            </section>

            <section class="panel">
              <h2>Agent runtime</h2>
              <div class="field-row">
                <label>Pipeline execution
                  <select id="f-runtime-primary">
                    <option value="claude-code">Claude Code</option>
                    <option value="codex">Codex</option>
                  </select>
                </label>
                <label>Skill editing
                  <select id="f-runtime-editing">
                    <option value="claude-code">Claude Code</option>
                    <option value="codex">Codex</option>
                    <option value="both">Both</option>
                  </select>
                </label>
              </div>
            </section>

            <section class="panel">
              <h2>Connectors</h2>
              <div id="connector-groups"></div>
            </section>

            <section class="panel">
              <h2>Diligence</h2>
              <label class="checkbox-label">
                <input id="f-diligence-enabled" type="checkbox" />
                Diligence pipeline enabled
              </label>
              <ul id="specialist-list" class="specialist-list"></ul>
            </section>
          </div>

          <div class="preview">
            <div class="tabs">
              <button class="tab-btn active" data-tab="config">originate.config.json</button>
              <button class="tab-btn" data-tab="generate">Generate skill</button>
            </div>

            <div id="tab-config" class="tab-panel">
              <div class="panel-header">
                <span>Live config state</span>
                <button id="copy-json-btn" class="ghost-btn">Copy JSON</button>
              </div>
              <textarea id="config-editor" spellcheck="false"></textarea>
              <div class="editor-actions">
                <button id="apply-json-btn">Apply edited JSON</button>
                <span id="json-status"></span>
              </div>
            </div>

            <div id="tab-generate" class="tab-panel" hidden>
              <div class="panel-header generate-controls">
                <label>Skill template
                  <select id="skill-select"></select>
                </label>
                <label id="specialist-picker-wrap" hidden>Specialist
                  <select id="specialist-select"></select>
                </label>
                <button id="generate-btn">Generate</button>
              </div>
              <pre id="generated-output" class="skill-output">Pick a skill template and click Generate.</pre>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="pet.js"></script>
  <script src="engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
